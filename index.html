<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Logger</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --surface: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #000000);
    --muted: var(--tg-theme-hint-color, #8b8b90);
    --accent: var(--tg-theme-button-color, #2f81f7);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #d64545;
    --ok: #2e9e5b;
    --line: rgba(128,128,128,0.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .hide { display: none !important; }

  .trip-id { font-size: 12px; color: var(--muted); }
  .trip-route { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .driver { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .progress { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .row.done { color: var(--muted); }
  .row.next { font-weight: 600; }
  .row.pending { color: var(--muted); opacity: 0.45; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.done { background: var(--ok); }
  .dot.next { background: var(--accent); }
  .dot.pending { background: var(--muted); opacity: 0.5; }

  button {
    width: 100%; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 500; font-family: inherit;
    padding: 14px; cursor: pointer; background: var(--surface); color: var(--text);
  }
  button:active { opacity: 0.7; }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.ghost { background: transparent; color: var(--muted); font-size: 14px; padding: 12px; }
  button + button { margin-top: 8px; }

  .section-label { font-size: 12px; color: var(--muted); margin: 16px 0 6px; }

  .card { background: var(--surface); border-radius: 12px; padding: 14px; margin-top: 12px; font-size: 14px; }
  .card .event { font-weight: 600; font-size: 16px; margin-top: 3px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }

  textarea {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font-family: inherit; font-size: 14px; margin-top: 6px; resize: none;
  }

  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px;
          color: var(--muted); padding: 4px 0; cursor: pointer; }

  .gps { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  .gps.ok { color: var(--ok); }
  .gps.err { color: var(--danger); }

  .warn { font-size: 13px; color: var(--danger); text-align: center; padding: 30px 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="blocked" class="warn hide"></div>

<div id="app" class="hide">

  <!-- MAIN -->
  <div id="screenMain">
    <div class="trip-id" id="tripId">—</div>
    <div class="trip-route" id="tripRoute">—</div>
    <div class="driver" id="driverName">—</div>

    <div class="progress" id="progressList"></div>

    <div class="section-label">Next</div>
    <button class="primary" id="btnNext">—</button>
    <button class="ghost" id="btnOthers">Others</button>

    <div class="gps" id="gpsMain">Getting location…</div>
  </div>

  <!-- OTHERS -->
  <div id="screenOthers" class="hide">
    <div class="back" id="backFromOthers">← Others</div>

    <div class="section-label">Trip Cancelled</div>
    <button data-event="Trip Cancelled — Shipper Liable">Shipper Liable</button>
    <button data-event="Trip Cancelled — 3PL Liable">3PL Liable</button>
    <button data-event="Trip Cancelled — NV Liable">NV Liable</button>

    <div class="section-label">Disruptions</div>
    <button data-event="Vehicle Breakdown">Vehicle Breakdown</button>
    <button data-event="Accident">Accident</button>

    <div class="section-label">Anything else</div>
    <button class="ghost" id="btnFreeText">Report something else</button>
  </div>

  <!-- CONFIRM -->
  <div id="screenConfirm" class="hide">
    <div class="back" id="backFromConfirm">← Back</div>

    <div class="card">
      <div class="trip-id" id="confirmTrip">—</div>
      <div class="event" id="confirmEvent">—</div>
      <div class="meta" id="confirmGps">—</div>
    </div>

    <div class="section-label" id="noteLabel">Note (optional)</div>
    <textarea id="note" rows="3" placeholder="Anything worth recording"></textarea>

    <button class="primary" id="btnSubmit" style="margin-top:12px">Submit</button>
    <div class="gps">The office records the time when this arrives.</div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // =================================================================
  //  The bot is the source of truth. It opens this app with the trip
  //  and current step in the URL, so this page never guesses and never
  //  stores progress. Close it and reopen — the bot tells it again.
  // =================================================================

  var tg = window.Telegram && window.Telegram.WebApp;

  function block(msg) {
    var el = document.getElementById("blocked");
    el.textContent = msg;
    el.classList.remove("hide");
  }

  if (!tg || !tg.initData) {
    block("Open this from inside Telegram, using the Trip Logger button on your keyboard.");
    return;
  }

  tg.ready();
  tg.expand();

  // --- The nine pilot events, matching the Apps Script ---------------

  var EVENTS = [
    "Start Trip",
    "Pickup — Truck Arrival",
    "Loading Start",
    "Loading Complete",
    "Pickup — Truck Departure",
    "Drop off — Truck Arrival",
    "Unloading Start",
    "Unloading Complete",
    "Trip Complete"
  ];

  // Steps where position is worth capturing. Must match the script's
  // gps flags, or the app asks for location the script ignores.
  var GPS_STEPS = { 1: true, 2: true, 5: true, 6: true, 9: true };

  // --- Read what the bot passed in ----------------------------------

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }

  var TRIP  = param("trip");
  var STEP  = parseInt(param("step"), 10);
  var ROUTE = param("route") || "";

  if (!TRIP || !STEP || STEP < 1 || STEP > EVENTS.length) {
    block("Open this from the Trip Logger button on the keyboard, not from the menu " +
          "beside the message box. The bot needs to tell the app which trip you are on.");
    return;
  }

  document.getElementById("app").classList.remove("hide");

  // --- State --------------------------------------------------------

  var pendingEvent = null;
  var pendingKind = null;            // "event" | "other" | "freetext"
  var loc = { status: "pending", lat: null, lon: null, accuracy: null };

  function nextEventName() { return EVENTS[STEP - 1]; }
  function nextNeedsGps()  { return !!GPS_STEPS[STEP]; }

  // --- Location -----------------------------------------------------

  function requestLocation() {
    if (!nextNeedsGps()) { loc.status = "notneeded"; renderGps(); return; }
    if (!navigator.geolocation) { loc.status = "unsupported"; renderGps(); return; }

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        loc.status = "ok";
        loc.lat = pos.coords.latitude;
        loc.lon = pos.coords.longitude;
        loc.accuracy = Math.round(pos.coords.accuracy);
        renderGps();
      },
      function (err) {
        loc.status = (err.code === 1) ? "denied" : "failed";
        renderGps();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
    );
  }

  function gpsText() {
    switch (loc.status) {
      case "ok":          return loc.lat.toFixed(5) + ", " + loc.lon.toFixed(5) + " (±" + loc.accuracy + "m)";
      case "notneeded":   return "Location not needed for this step";
      case "denied":      return "Location denied — time will still be recorded";
      case "failed":      return "Could not get location — time will still be recorded";
      case "unsupported": return "Location not available on this device";
      default:            return "Getting location…";
    }
  }

  function renderGps() {
    var el = document.getElementById("gpsMain");
    el.textContent = gpsText();
    el.className = "gps" + (loc.status === "ok" ? " ok"
                  : (loc.status === "pending" || loc.status === "notneeded" ? "" : " err"));
    var c = document.getElementById("confirmGps");
    if (c && pendingKind === "event") c.textContent = gpsText();
  }

  // --- Render -------------------------------------------------------

  function renderHeader() {
    document.getElementById("tripId").textContent = TRIP;
    document.getElementById("tripRoute").textContent = ROUTE || "Trip in progress";
    var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    document.getElementById("driverName").textContent =
      u ? (u.first_name + (u.last_name ? " " + u.last_name : "")) : "";
  }

  function renderProgress() {
    var list = document.getElementById("progressList");
    list.innerHTML = "";

    EVENTS.forEach(function (name, i) {
      var n = i + 1;
      var state = n < STEP ? "done" : (n === STEP ? "next" : "pending");

      // Keep it readable: everything done, the next step, one lookahead.
      if (state === "pending" && n > STEP + 1) return;

      var row = document.createElement("div");
      row.className = "row " + state;
      var dot = document.createElement("span");
      dot.className = "dot " + state;
      var label = document.createElement("span");
      label.textContent = name;
      row.appendChild(dot);
      row.appendChild(label);
      list.appendChild(row);
    });

    document.getElementById("btnNext").textContent = nextEventName();
  }

  // --- Navigation ---------------------------------------------------

  var screens = ["screenMain", "screenOthers", "screenConfirm"];

  function show(id) {
    screens.forEach(function (s) {
      document.getElementById(s).classList.toggle("hide", s !== id);
    });
    if (id === "screenMain") tg.BackButton.hide(); else tg.BackButton.show();
    window.scrollTo(0, 0);
  }

  function goConfirm(eventName, kind) {
    pendingEvent = eventName;
    pendingKind = kind;

    document.getElementById("confirmTrip").textContent = TRIP;
    document.getElementById("confirmEvent").textContent =
      kind === "freetext" ? "Report to the office" : eventName;
    document.getElementById("confirmGps").textContent =
      kind === "event" ? gpsText() : "Goes to the office for review";

    document.getElementById("noteLabel").textContent =
      kind === "freetext" ? "What happened" : "Note (optional)";
    document.getElementById("note").value = "";

    show("screenConfirm");
  }

  // --- Submit -------------------------------------------------------

  function submit() {
    if (!pendingEvent) return;
    var note = document.getElementById("note").value.trim();

    if (pendingKind === "freetext" && !note) {
      tg.showAlert("Please type what happened first.");
      return;
    }

    var usingLoc = (pendingKind === "event" && loc.status === "ok");

    var payload = {
      v: 1,
      kind: pendingKind,
      trip: TRIP,
      step: STEP,
      event: pendingEvent,
      note: note || null,
      lat: usingLoc ? loc.lat : null,
      lon: usingLoc ? loc.lon : null,
      acc: usingLoc ? loc.accuracy : null,
      gps: loc.status,
      // Phone clock — reference only. The script stamps the real time.
      client_time: new Date().toISOString()
    };

    try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}

    // Delivers to the bot and closes the app. Only works when this app
    // was opened from a reply-keyboard button.
    tg.sendData(JSON.stringify(payload));
  }

  // --- Wiring -------------------------------------------------------

  document.getElementById("btnNext").addEventListener("click", function () {
    goConfirm(nextEventName(), "event");
  });
  document.getElementById("btnOthers").addEventListener("click", function () { show("screenOthers"); });
  document.getElementById("btnFreeText").addEventListener("click", function () {
    goConfirm("Free text report", "freetext");
  });
  document.getElementById("btnSubmit").addEventListener("click", submit);

  document.getElementById("backFromOthers").addEventListener("click", function () { show("screenMain"); });
  document.getElementById("backFromConfirm").addEventListener("click", function () { show("screenMain"); });

  Array.prototype.forEach.call(
    document.querySelectorAll("#screenOthers button[data-event]"),
    function (b) {
      b.addEventListener("click", function () { goConfirm(b.getAttribute("data-event"), "other"); });
    }
  );

  tg.BackButton.onClick(function () { show("screenMain"); });

  // --- Start --------------------------------------------------------

  renderHeader();
  renderProgress();
  requestLocation();
  show("screenMain");
})();
</script>
</body>
</html>
